<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open vs Closed AI Models</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&family=Shantell+Sans:wght@300..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main>
      <article>
        <h1
          ><span class="open">Open</span> vs
          <span class="closed">Closed</span> AI Models</h1
        >
        <div id="chart"></div>
        <footer>
          <p
            >Source:
            <a href="https://whatmodel.sh/race" target="_blank"
              >whatmodel.sh / open vs closed</a
            >. Scores are today's; 50 is an average model.</p
          >
          <p
            >Inspiration: William Playfair's
            <a
              href="https://en.wikipedia.org/wiki/William_Playfair#/media/File:Playfair_TimeSeries-2.png"
              target="_blank"
              >trade-balance time-series chart</a
            >, published in Commercial and Political Atlas, 1786</p
          >
        </footer>
      </article>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
